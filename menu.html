        const ORDERS_STORAGE_KEY = 'marasy_customer_orders_v1';
        const itemQuantities = {};
        let currentSelectedCategory = 'all';

        function getCurrentLang() {
            return window.MarasyI18n ? window.MarasyI18n.getLang() : 'ar';
        }

        function tr(key, fallback) {
            return window.MarasyI18n ? window.MarasyI18n.t(key, fallback) : fallback;
        }

        function pickText(val) {
            if (val && typeof val === 'object') {
                const lang = getCurrentLang();
                return val[lang] || val.ar || val.en || '';
            }
            return val || '';
        }

        function findOrderMeta(key) {
            const parts = key.split('__');
            const baseId = parts[0];
            const sizeCode = parts[1] || null;

            const sizeAr = { m: 'وسط (M)', l: 'كبير (L)', xl: 'عائلي (XL)' };
            const sizeEn = { m: 'Medium (M)', l: 'Large (L)', xl: 'Family (XL)' };

            for (const sec of menuSections) {
                for (const item of sec.items) {
                    if (item.id === baseId) {
                        const baseAr = typeof item.name === 'object' ? item.name.ar : item.name;
                        const baseEn = typeof item.name === 'object' ? item.name.en : item.name;
                        const nameAr = sizeCode ? `${baseAr} (${sizeAr[sizeCode] || sizeCode})` : baseAr;
                        const nameEn = sizeCode ? `${baseEn} (${sizeEn[sizeCode] || sizeCode})` : baseEn;
                        const activeName = getCurrentLang() === 'en' ? nameEn : nameAr;
                        return { key, name: activeName, name_ar: nameAr, name_en: nameEn };
                    }
                }
            }
            return { key, name: key, name_ar: key, name_en: key };
        }

        function syncOrdersToStorage() {
            try {
                const ordersList = [];
                Object.keys(itemQuantities).forEach(key => {
                    const qty = itemQuantities[key];
                    if (typeof qty === 'number' && qty > 0) {
                        const meta = findOrderMeta(key);
                        ordersList.push({
                            key: meta.key,
                            name: meta.name,
                            name_ar: meta.name_ar,
                            name_en: meta.name_en,
                            qty: qty
                        });
                    }
                });
                sessionStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(ordersList));
            } catch (e) {}
        }

        function hydrateQuantitiesFromStorage() {
            try {
                localStorage.removeItem(ORDERS_STORAGE_KEY);
                const raw = sessionStorage.getItem(ORDERS_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                if (Array.isArray(parsed)) {
                    parsed.forEach(entry => {
                        if (entry && entry.key && typeof entry.qty === 'number' && entry.qty > 0) {
                            itemQuantities[entry.key] = entry.qty;
                        }
                    });
                }
            } catch (e) {}
        }

        function getQty(key) {
            return typeof itemQuantities[key] === 'number' ? itemQuantities[key] : 0;
        }

        function changeQty(key, delta) {
            const current = getQty(key);
            const next = Math.max(0, current + delta);
            itemQuantities[key] = next;
            syncOrdersToStorage();
            renderAllSections(currentSelectedCategory);
        }

        function buildQtyCounter(key) {
            const qty = getQty(key);
            const dirAttr = getCurrentLang() === 'en' ? 'ltr' : 'rtl';
            return `
                <div class="inline-flex items-center gap-1.5 shrink-0" dir="${dirAttr}">
                    <button
                        type="button"
                        onclick="changeQty('${key}', 1)"
                        aria-label="${tr('qty_inc_aria', 'زيادة الكمية')}"
                        class="w-7 h-7 rounded-full bg-marasy-navy hover:bg-slate-900 text-white flex items-center justify-center text-xs font-black shadow-sm transition cursor-pointer"
                    >
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <span class="min-w-[1.5rem] text-center text-sm font-black text-slate-900 select-none">
                        ${qty}
                    </span>
                    <button
                        type="button"
                        onclick="changeQty('${key}', -1)"
                        aria-label="${tr('qty_dec_aria', 'تقليل الكمية')}"
                        class="w-7 h-7 rounded-full bg-marasy-navy hover:bg-slate-900 text-white flex items-center justify-center text-xs font-black shadow-sm transition cursor-pointer"
                    >
                        <i class="fa-solid fa-minus"></i>
                    </button>
                </div>
            `;
        }

        function handleImgError(imgEl, baseName) {
            const step = Number(imgEl.dataset.fallbackStep || 0);
            const fallbacks = ['.png', '.jpeg', '.PNG'];
            if (step < fallbacks.length) {
                imgEl.dataset.fallbackStep = String(step + 1);
                imgEl.src = baseName + fallbacks[step];
            } else {
                imgEl.classList.add('hidden');
                const notice = imgEl.nextElementSibling;
                if (notice) notice.classList.remove('hidden');
            }
        }

        function buildImageBox(item) {
            const dotIdx = item.img.lastIndexOf('.');
            const baseName = dotIdx > -1 ? item.img.slice(0, dotIdx) : item.img;
            const itemName = pickText(item.name);
            return `
                <div class="relative w-full h-44 bg-white border-b border-slate-200 flex items-center justify-center overflow-hidden">
                    <img
                        src="${item.img}"
                        alt="${itemName}"
                        data-fallback-step="0"
                        onerror="handleImgError(this, '${baseName}')"
                        loading="lazy"
                        class="w-full h-full object-cover"
                    />
                    <div class="hidden flex-col items-center justify-center text-center p-3 text-slate-400 select-none">
                        <i class="fa-regular fa-image text-2xl mb-1 text-slate-300"></i>
                        <span class="text-[11px] font-bold text-slate-500" dir="ltr">${item.img}</span>
                    </div>
                </div>
            `;
        }

        function buildPizzaSizeRow(itemId, sizeCode, label, price) {
            const sizeKey = `${itemId}__${sizeCode}`;
            const currencyText = tr('currency', 'ج.م');
            return `
                <div class="flex items-center justify-between gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-extrabold text-slate-900">${label}</span>
                        <span class="text-xs font-black text-marasy-red bg-red-50 border border-red-100 px-2 py-0.5 rounded-md">${price} ${currencyText}</span>
                    </div>
                    ${buildQtyCounter(sizeKey)}
                </div>
            `;
        }

        function renderAllSections(activeCategory = 'all') {
            currentSelectedCategory = activeCategory;
            const container = document.getElementById('menuSectionsContainer');
            if (!container) return;
            container.innerHTML = '';

            const currencyText = tr('currency', 'ج.م');
            const itemsSuffix = tr('items_count_suffix', 'صنف');
            const priceLabel = tr('price_label', 'السعر');
            const recommendedText = tr('recommended_badge', 'مُوصى به');

            menuSections.forEach(section => {
                if (activeCategory !== 'all' && section.id !== activeCategory) return;
                if (!section.items || section.items.length === 0) return;

                const sectionTitle = pickText(section.title);
                const sectionEl = document.createElement('section');
                sectionEl.id = `section-${section.id}`;
                sectionEl.className = 'bg-white scroll-mt-36';

                const headerHTML = `
                    <div class="flex items-center justify-between border-b-2 border-marasy-red pb-3 mb-6">
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2.5">
                            <i class="fa-solid ${section.icon} text-marasy-redLight"></i>
                            <span>${sectionTitle}</span>
                        </h2>
                        <span class="text-xs font-bold text-slate-600 bg-white border border-slate-200 px-3 py-1 rounded-full">
                            ${section.items.length} ${itemsSuffix}
                        </span>
                    </div>
                `;

                let cardsHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 bg-white">`;

                section.items.forEach(item => {
                    const imageBox = buildImageBox(item);
                    const itemName = pickText(item.name);
                    const specialBadge = item.special
                        ? `<span class="inline-block text-[10px] bg-marasy-red text-white px-2 py-0.5 rounded-full mx-1.5 font-bold align-middle">${recommendedText}</span>`
                        : '';

                    if (section.type === 'pizza') {
                        cardsHTML += `
                            <article class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                ${imageBox}
                                <div class="p-4 bg-white flex-1 flex flex-col justify-between gap-3">
                                    <h3 class="font-extrabold text-slate-900 text-base leading-snug bg-white">
                                        ${itemName} ${specialBadge}
                                    </h3>
                                    <div class="flex flex-col gap-2 pt-2 border-t border-slate-100">
                                        ${buildPizzaSizeRow(item.id, 'm', tr('size_m', 'وسط (M)'), item.m)}
                                        ${buildPizzaSizeRow(item.id, 'l', tr('size_l', 'كبير (L)'), item.l)}
                                        ${buildPizzaSizeRow(item.id, 'xl', tr('size_xl', 'عائلي (XL)'), item.xl)}
                                    </div>
                                </div>
                            </article>
                        `;
                    } else {
                        cardsHTML += `
                            <article class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                ${imageBox}
                                <div class="p-4 bg-white flex-1 flex flex-col justify-between gap-3">
                                    <div class="flex items-center justify-between gap-2">
                                        <h3 class="font-extrabold text-slate-900 text-sm sm:text-base leading-snug bg-white">
                                            ${itemName} ${specialBadge}
                                        </h3>
                                        ${buildQtyCounter(item.id)}
                                    </div>
                                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                                        <span class="text-xs text-slate-500 font-bold">${priceLabel}</span>
                                        <span class="text-xs sm:text-sm font-black text-slate-900 bg-white border border-slate-200 px-3 py-1 rounded-lg whitespace-nowrap">
                                            ${item.price} ${currencyText}
                                        </span>
                                    </div>
                                </div>
                            </article>
                        `;
                    }
                });

                cardsHTML += `</div>`;
                sectionEl.innerHTML = headerHTML + cardsHTML;
                container.appendChild(sectionEl);
            });

            container.classList.remove('opacity-0');
            container.classList.add('opacity-100');
        }

        function updateActiveTab(catId) {
            document.querySelectorAll('.cat-tab').forEach(btn => {
                if (btn.dataset.cat === catId) {
                    btn.className = 'cat-tab whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold bg-marasy-gold text-marasy-dark transition shrink-0 cursor-pointer';
                } else {
                    btn.className = 'cat-tab whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-marasy-dark/80 text-marasy-gold hover:text-marasy-goldLight border border-marasy-gold/30 transition shrink-0 cursor-pointer';
                }
            });
        }

        function selectCategory(catId) {
            updateActiveTab(catId);
            renderAllSections(catId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initMenuPage() {
            hydrateQuantitiesFromStorage();
            renderAllSections('all');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMenuPage);
        } else {
            initMenuPage();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.MarasyI18n) {
                window.MarasyI18n.onChange(() => {
                    renderAllSections(currentSelectedCategory);
                });
            }
        });
    </script>
</body>
</html>
